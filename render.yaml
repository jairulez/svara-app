services:
  - type: web
    name: svara
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node scripts/migrate.js && node scripts/seed.js && node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/svara.db
      - key: DEMO_MODE
        value: "true"
      - key: COMMERCE_ENABLED
        value: "false"
      - key: LLM_PROVIDER
        value: none
